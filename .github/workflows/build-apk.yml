name: Gerar APK HyperDroid Plus

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar ferramentas Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair ZIP
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP_FILE" || { echo "ZIP nao encontrado"; exit 1; }
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS_FILE=$(find extracted -name settings.gradle -print -quit)
          test -n "$SETTINGS_FILE" || { echo "Projeto nao encontrado"; exit 1; }
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cp -a "$PROJECT_DIR"/. .

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperDroidPlus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
