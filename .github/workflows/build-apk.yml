name: Gerar APK DarkPC

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar ferramentas Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair ZIP
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP_FILE" || { echo "ZIP nao encontrado"; exit 1; }
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS_FILE=$(find extracted -name settings.gradle -print -quit)
          test -n "$SETTINGS_FILE" || { echo "Projeto nao encontrado"; exit 1; }
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cp -a "$PROJECT_DIR"/. .

      - name: Aplicar atualizacoes do DarkPC
        run: |
          test -s darkpc-overlay.tar.gz.b64
          mkdir -p overlay
          base64 -d darkpc-overlay.tar.gz.b64 | tar -xz -C overlay
          cp -a overlay/. .
          echo "f86bea4e9b9cd20409d2f96b4005161e5113b5f67dbf0e34dd018123364606bc  app/src/main/res/drawable-nodpi/hyperdroid_plus_icon.png" | sha256sum -c -

      - name: Disponibilizar codigo-fonte DarkPC
        uses: actions/upload-artifact@v4
        with:
          name: DarkPC-source
          path: |
            app/
            build.gradle
            settings.gradle
            gradle.properties
          if-no-files-found: error
          retention-days: 14

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkPC-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
